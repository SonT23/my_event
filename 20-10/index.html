<script>
  // Chỉ chạy hiệu ứng khi người xem không bật "giảm chuyển động"; nếu không, trang hiện đầy đủ ngay.
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches) document.documentElement.classList.add('anim');
</script>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100svh;
    font-family: 'Lora', Georgia, 'Times New Roman', serif;
    color: #ffe3ea;
    background: #1a0511;
    overflow-x: hidden;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    background:
      radial-gradient(80% 45% at 50% 110%, rgba(255, 143, 171, .22), transparent 70%),
      radial-gradient(130% 75% at 50% -5%, #8c2a55 0%, #4a1033 42%, #1f0716 100%);
  }

  /* ---------- Lớp nền: đốm sáng, pháo hoa, cánh hoa ---------- */
  .bokeh { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  .bokeh i {
    position: absolute;
    left: var(--x);
    top: var(--y);
    width: var(--s);
    height: var(--s);
    margin: calc(var(--s) / -2) 0 0 calc(var(--s) / -2);
    border-radius: 50%;
    background: radial-gradient(circle, var(--c), transparent 70%);
  }
  .anim .bokeh i { animation: drift var(--t) ease-in-out infinite alternate; }
  @keyframes drift { to { transform: translate(40px, -60px) scale(1.15); } }

  canvas.layer { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #fx { z-index: 0; }
  #petals { z-index: 2; }
  .anim #petals { opacity: 0; transition: opacity 2.5s ease; }
  .anim.s-heart #petals { opacity: 1; }

  /* ---------- Mở màn: trái tim tự vẽ ---------- */
  .intro { display: none; }
  .anim .intro { position: fixed; inset: 0; z-index: 3; display: grid; place-items: center; pointer-events: none; }
  .intro svg { width: min(40vw, 170px); overflow: visible; }
  .heart-line {
    fill: url(#heartFill);
    fill-opacity: 0;
    stroke: #ffd6e0;
    stroke-width: 1.4;
    stroke-linejoin: round;
    filter: drop-shadow(0 0 8px rgba(255, 130, 165, .9));
  }
  .s-heart .heart-line { animation: draw 1.3s cubic-bezier(.6, .1, .4, 1) forwards, fill-in .7s ease 1.05s forwards; }
  .s-heart .intro svg { animation: beat .85s ease-in-out 1.7s 2; }
  .s-pop .intro svg { animation: pop .5s cubic-bezier(.5, 0, .75, 0) forwards; }
  .s-gone .intro { display: none; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes fill-in { to { fill-opacity: 1; } }
  @keyframes beat { 0%, 100% { transform: scale(1); } 30% { transform: scale(1.13); } 60% { transform: scale(.97); } }
  @keyframes pop { to { transform: scale(1.5); opacity: 0; } }

  /* ---------- Nội dung ---------- */
  .stage {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(20px, 3.5vh, 40px);
    padding: max(clamp(24px, 4vh, 40px), env(safe-area-inset-top)) 16px max(clamp(24px, 5vh, 48px), env(safe-area-inset-bottom));
    text-align: center;
  }
  .hero { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .greeting {
    margin: 0;
    padding: .15em .5em;
    font-family: 'Dancing Script', cursive;
    font-weight: 700;
    font-size: clamp(3rem, min(12vw, 8.5vh), 5.75rem);
    line-height: 1.05;
    color: #ffe9ef;
    text-shadow: 0 2px 12px rgba(31, 7, 22, .7), 0 0 28px rgba(255, 120, 160, .55);
  }
  .title {
    margin: 0;
    font-family: 'Playfair Display', Georgia, serif;
    font-weight: 600;
    font-size: clamp(1rem, 3.8vw, 1.4rem);
    letter-spacing: .06em;
    color: #ffd3de;
    text-shadow: 0 1px 3px rgba(31, 7, 22, .9), 0 0 14px rgba(31, 7, 22, .8);
  }
  .date {
    margin: 2px 0 0;
    font-family: 'Playfair Display', Georgia, serif;
    font-weight: 600;
    font-size: clamp(2.4rem, min(10vw, 6.5vh), 4.2rem);
    line-height: 1.1;
    letter-spacing: .08em;
    background: linear-gradient(100deg, #c48a35 0%, #f4cf86 28%, #fff7e0 50%, #f4cf86 72%, #c48a35 100%);
    background-size: 250% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 4px 18px rgba(244, 207, 134, .25));
    animation: shimmer 5s linear infinite;
  }
  @keyframes shimmer { from { background-position: 166.667% 0; } to { background-position: 0 0; } }

  .letter {
    position: relative;
    width: min(600px, 100%);
    margin-top: 36px;
    padding: 56px clamp(22px, 6vw, 44px) 24px;
    border-radius: 20px;
    background: linear-gradient(180deg, #fffaf5, #fff2e9);
    color: #4a1f2e;
    text-align: left;
    font-size: clamp(1rem, 3.9vw, 1.1rem);
    line-height: 1.7;
    box-shadow: 0 34px 80px -24px rgba(0, 0, 0, .65), 0 0 0 1px rgba(255, 255, 255, .7) inset;
  }
  .letter::after {
    content: "";
    position: absolute;
    inset: 10px;
    border: 1px solid rgba(224, 86, 127, .2);
    border-radius: 13px;
    pointer-events: none;
  }
  .letter p { margin: 0 0 .7em; }
  .salute {
    font-family: 'Dancing Script', cursive;
    font-weight: 700;
    font-size: 1.65em;
    line-height: 1.2;
    color: #d0426f;
  }
  .letter .sign {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: .3em;
    margin: .5em 0 0;
    font-family: 'Dancing Script', cursive;
    font-weight: 700;
    font-size: 1.9em;
    line-height: 1.2;
    color: #d0426f;
  }
  .sign-text { padding: .1em .2em; }
  .sign-heart { width: .62em; height: .62em; fill: #e0567f; }

  .bloom {
    position: absolute;
    top: -50px;
    left: 50%;
    width: 100px;
    height: 100px;
    margin-left: -50px;
    filter: drop-shadow(0 8px 14px rgba(110, 15, 55, .35));
  }
  .bloom .pt, .bloom-inner { transform-origin: 60px 60px; }

  /* ---------- Trạng thái ẩn ban đầu & các bước hiện ra ---------- */
  .anim .greeting, .anim .sign-text {
    -webkit-mask-image: linear-gradient(90deg, #000 40%, transparent 60%);
    mask-image: linear-gradient(90deg, #000 40%, transparent 60%);
    -webkit-mask-size: 250% 300%;
    mask-size: 250% 300%;
    -webkit-mask-repeat: no-repeat;
    mask-repeat: no-repeat;
    -webkit-mask-position: 100% 50%;
    mask-position: 100% 50%;
  }
  .s-greet .greeting { animation: write 2.2s cubic-bezier(.45, .05, .4, 1) forwards; }
  .s-sign .sign-text { animation: write 1.8s cubic-bezier(.45, .05, .4, 1) forwards; }
  .s-title .greeting, .s-done .sign-text { -webkit-mask: none; mask: none; }
  @keyframes write { to { -webkit-mask-position: 0 50%; mask-position: 0 50%; } }

  .anim .title { opacity: 0; transform: translateY(12px); filter: blur(6px); transition: opacity 1s ease, transform 1s ease, filter 1s ease; }
  .s-title .title { opacity: 1; transform: none; filter: none; }
  .anim .date { opacity: 0; transform: scale(.6); transition: opacity .9s ease .35s, transform 1.1s cubic-bezier(.2, 1.5, .35, 1) .35s; }
  .s-title .date { opacity: 1; transform: none; }

  .anim .letter { opacity: 0; transform: translateY(46px); transition: opacity 1s ease, transform 1.1s cubic-bezier(.2, .8, .25, 1); }
  .s-letter .letter { opacity: 1; transform: none; }
  .anim .bloom .pt { transform: scale(0); }
  .s-letter .bloom .pt { animation: bloom .75s cubic-bezier(.3, 1.5, .5, 1) forwards; animation-delay: calc(.45s + var(--d) * 60ms); }
  .s-done .bloom-inner { animation: breathe 5s ease-in-out infinite; }
  @keyframes bloom { to { transform: scale(1); } }
  @keyframes breathe { 50% { transform: rotate(8deg) scale(1.04); } }

  .ch { position: relative; }
  .anim .body .ch { opacity: 0; transition: opacity .35s ease; }
  .anim .body .ch.on { opacity: 1; }
  .ch.cur::after {
    content: "";
    position: absolute;
    right: -2px;
    top: .2em;
    bottom: .15em;
    width: 2px;
    border-radius: 1px;
    background: #d0426f;
    animation: blink .9s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .anim .sign-heart { opacity: 0; transition: opacity .6s ease; }
  .s-done .sign-heart { opacity: 1; animation: pulse 1.3s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { transform: scale(1); } 20% { transform: scale(1.25); } 40% { transform: scale(1); } 60% { transform: scale(1.15); } }

  @media (prefers-reduced-motion: reduce) {
    .date { animation: none; }
  }
</style>
</head>
<body>

<div class="bokeh" aria-hidden="true">
  <i style="--x:12%;--y:20%;--s:260px;--t:19s;--c:rgba(255,150,185,.26)"></i>
  <i style="--x:86%;--y:14%;--s:200px;--t:23s;--c:rgba(244,207,134,.16)"></i>
  <i style="--x:78%;--y:72%;--s:320px;--t:21s;--c:rgba(255,120,165,.2)"></i>
  <i style="--x:18%;--y:82%;--s:220px;--t:17s;--c:rgba(244,207,134,.14)"></i>
  <i style="--x:50%;--y:46%;--s:420px;--t:27s;--c:rgba(255,160,190,.12)"></i>
</div>
<canvas id="fx" class="layer" aria-hidden="true"></canvas>

<div class="intro" aria-hidden="true">
  <svg viewBox="0 0 100 92">
    <defs>
      <linearGradient id="heartFill" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ff9fb8"/>
        <stop offset="1" stop-color="#d92a63"/>
      </linearGradient>
    </defs>
    <path class="heart-line" d="M50 86C22 64 4 46 4 27 4 13 15 4 28 4c9 0 17 5 22 13C55 9 63 4 72 4c13 0 24 9 24 23 0 19-18 37-46 59z"/>
  </svg>
</div>

<main class="stage">
  <header class="hero">
    <p class="greeting">Chúc mừng Mẹ</p>
    <h1 class="title">Ngày Phụ nữ Việt Nam</h1>
    <p class="date">20 · 10</p>
  </header>

  <article class="letter">
    <svg class="bloom" viewBox="0 0 120 120" aria-hidden="true">
      <defs>
        <radialGradient id="petalOuter" cx="50%" cy="90%" r="85%">
          <stop offset="0" stop-color="#b8174f"/>
          <stop offset=".55" stop-color="#f2668f"/>
          <stop offset="1" stop-color="#ffd3de"/>
        </radialGradient>
        <radialGradient id="petalInner" cx="50%" cy="90%" r="85%">
          <stop offset="0" stop-color="#d93a6c"/>
          <stop offset="1" stop-color="#ffe6ed"/>
        </radialGradient>
        <radialGradient id="coreFill">
          <stop offset="0" stop-color="#fff6d6"/>
          <stop offset="1" stop-color="#e2a743"/>
        </radialGradient>
        <path id="petal" d="M60 60C47 47 45 22 60 10 75 22 73 47 60 60z"/>
      </defs>
      <g class="bloom-inner">
        <circle id="bloomCore" class="pt" cx="60" cy="60" r="10" fill="url(#coreFill)" style="--d:16"/>
      </g>
    </svg>

    <!-- Sửa lời chúc ở đây: mỗi <p> là một đoạn, hiệu ứng gõ chữ tự chạy theo nội dung -->
    <div class="body">
      <p class="salute">Mẹ ơi,</p>
      <p>Chúc Mẹ có một ngày 20/10 thật vui!</p>
      <p>Mong Mẹ luôn mạnh khỏe và bình an.</p>
    </div>
    <p class="sign">
      <span class="sign-text">Sơn</span>
      <svg class="sign-heart" viewBox="0 0 100 92" aria-hidden="true"><path d="M50 86C22 64 4 46 4 27 4 13 15 4 28 4c9 0 17 5 22 13C55 9 63 4 72 4c13 0 24 9 24 23 0 19-18 37-46 59z"/></svg>
    </p>
  </article>
</main>

<canvas id="petals" class="layer" aria-hidden="true"></canvas>

<script>
(() => {
  const root = document.documentElement;
  const $ = (s) => document.querySelector(s);
  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const NS = 'http://www.w3.org/2000/svg';

  buildBloom();
  if (!root.classList.contains('anim')) return;

  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
  window.scrollTo(0, 0);

  const letter = $('.letter');
  const lines = [...document.querySelectorAll('.body p')].map(splitChars);
  const heartLine = $('.heart-line');
  const len = heartLine.getTotalLength();
  heartLine.style.strokeDasharray = len;
  heartLine.style.strokeDashoffset = len;

  const petals = createPetals($('#petals'));
  const fx = createFireworks($('#fx'));
  addEventListener('resize', () => { petals.resize(); fx.resize(); });

  // Pháo hoa chỉ bắt đầu bắn định kỳ sau khi lá thư viết xong
  let showtime = false;
  let nextShot = 0;
  let last = performance.now();
  requestAnimationFrame(function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    petals.step(dt, now / 1000);
    if (showtime && now >= nextShot) {
      shoot(Math.random() < 0.45 ? 'heart' : 'round');
      nextShot = now + rand(1500, 3200);
    }
    fx.step(dt);
    requestAnimationFrame(frame);
  });

  // Người xem tự cuộn thì thôi không tự cuộn theo chữ nữa
  let userScrolled = false;
  let scrollLock = 0;
  for (const ev of ['wheel', 'touchmove', 'keydown']) {
    addEventListener(ev, () => { userScrolled = true; }, { once: true, passive: true });
  }

  play().catch(() => root.classList.remove('anim'));

  async function play() {
    // Link mở ở tab nền thì đợi đến khi Mẹ thực sự nhìn thấy trang mới chạy
    if (document.hidden) {
      await new Promise((r) => document.addEventListener('visibilitychange', function onShow() {
        if (document.hidden) return;
        document.removeEventListener('visibilitychange', onShow);
        r();
      }));
    }
    await Promise.race([document.fonts && document.fonts.ready, sleep(2500)]);
    await sleep(250);

    root.classList.add('s-heart');
    await sleep(3400);

    root.classList.add('s-pop');
    const h = $('.intro svg').getBoundingClientRect();
    fx.burst(h.left + h.width / 2, h.top + h.height * 0.45, 'heart', Math.min(innerWidth, innerHeight) * 0.24);
    await sleep(500);

    root.classList.add('s-gone', 's-greet');
    await sleep(1700);
    root.classList.add('s-title');
    await sleep(1300);
    root.classList.add('s-letter');
    keepInView(letter.querySelector('.salute'));
    await sleep(1500);

    await typeLetter();
    root.classList.add('s-sign');
    keepInView($('.sign'));
    await sleep(1900);

    root.classList.add('s-done');
    for (const shape of ['round', 'heart', 'round']) {
      shoot(shape);
      await sleep(380);
    }
    nextShot = performance.now() + 1800;
    showtime = true;
  }

  async function typeLetter() {
    let cur = null;
    for (const chars of lines) {
      for (const ch of chars) {
        if (cur) cur.classList.remove('cur');
        ch.classList.add('on', 'cur');
        cur = ch;
        keepInView(ch);
        const c = ch.textContent;
        await sleep(/[.!?…]/.test(c) ? 420 : /[,;:—–]/.test(c) ? 210 : c === ' ' ? 40 : rand(26, 56));
      }
      await sleep(350);
    }
    if (cur) cur.classList.remove('cur');
  }

  function keepInView(el) {
    const now = performance.now();
    if (userScrolled || now < scrollLock) return;
    const r = el.getBoundingClientRect();
    if (r.bottom > innerHeight - 24) {
      scrollLock = now + 700;
      window.scrollBy({ top: r.bottom - innerHeight * 0.7, behavior: 'smooth' });
    }
  }

  function splitChars(p) {
    const text = p.textContent.normalize('NFC').replace(/\s+/g, ' ').trim();
    const parts = 'Segmenter' in Intl
      ? Array.from(new Intl.Segmenter('vi', { granularity: 'grapheme' }).segment(text), (s) => s.segment)
      : Array.from(text);
    p.textContent = '';
    return parts.map((g) => {
      const span = document.createElement('span');
      span.className = 'ch';
      span.textContent = g;
      p.appendChild(span);
      return span;
    });
  }

  // Bắn pháo hoa vào chỗ trống quanh lá thư để không bị che mất
  function shoot(shape) {
    const W = innerWidth, H = innerHeight;
    const r = letter.getBoundingClientRect();
    const zones = [];
    if (r.top > 160) zones.push([W * 0.12, W * 0.88, H * 0.08, Math.min(r.top - 60, H * 0.45)]);
    if (r.left > 150) zones.push([40, r.left - 50, H * 0.12, H * 0.6], [r.right + 50, W - 40, H * 0.12, H * 0.6]);
    if (H - r.bottom > 180) zones.push([W * 0.15, W * 0.85, r.bottom + 70, H - 90]);
    const z = zones.length ? pick(zones) : [W * 0.12, W * 0.88, H * 0.1, H * 0.4];
    const radius = Math.max(60, Math.min(140, Math.min(W, H) * 0.17));
    fx.launch(rand(z[0], z[1]), rand(z[2], z[3]), shape, radius);
  }

  function fit(canvas) {
    const d = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(innerWidth * d);
    canvas.height = Math.round(innerHeight * d);
    canvas.getContext('2d').setTransform(d, 0, 0, d, 0, 0);
  }

  function createPetals(canvas) {
    const ctx = canvas.getContext('2d');
    const d = Math.min(window.devicePixelRatio || 1, 2);
    const S = 48;
    const sprites = [
      ['#d94a76', '#ffc6d5'], ['#ff8fab', '#ffe8ee'], ['#c23a64', '#ffa3bb'], ['#f39ab0', '#fff3f6'],
    ].map(([base, tip]) => {
      const c = document.createElement('canvas');
      c.width = c.height = S * d;
      const g = c.getContext('2d');
      g.scale(d, d);
      g.translate(S / 2, S / 2);
      const grad = g.createLinearGradient(0, 20, 0, -20);
      grad.addColorStop(0, base);
      grad.addColorStop(1, tip);
      g.beginPath();
      g.moveTo(0, 20);
      g.bezierCurveTo(16, 10, 18, -12, 6, -19);
      g.quadraticCurveTo(0, -14, -6, -19);
      g.bezierCurveTo(-18, -12, -16, 10, 0, 20);
      g.fillStyle = grad;
      g.fill();
      g.strokeStyle = 'rgba(255,255,255,.35)';
      g.beginPath();
      g.moveTo(0, 15);
      g.quadraticCurveTo(1.5, 0, 0, -12);
      g.stroke();
      return c;
    });

    const list = [];
    const spawn = (p, anywhere) => {
      p.size = rand(16, 32);
      p.x = rand(-20, innerWidth + 20);
      p.y = anywhere ? rand(-innerHeight, -30) : -40;
      p.vx = rand(-8, 14);
      p.vy = rand(28, 60) * (p.size / 24);
      p.amp = rand(12, 46);
      p.freq = rand(0.4, 1.1);
      p.phase = rand(0, Math.PI * 2);
      p.rot = rand(0, Math.PI * 2);
      p.vr = rand(-1.2, 1.2);
      p.flip = rand(1.2, 3);
      p.alpha = rand(0.55, 0.9);
      p.sprite = pick(sprites);
      return p;
    };
    const resize = () => {
      fit(canvas);
      const want = Math.round(Math.min(45, Math.max(14, (innerWidth * innerHeight) / 22000)));
      while (list.length < want) list.push(spawn({}, true));
      list.length = want;
    };
    resize();

    return {
      resize,
      step(dt, t) {
        ctx.clearRect(0, 0, innerWidth, innerHeight);
        for (const p of list) {
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.rot += p.vr * dt;
          if (p.y > innerHeight + 40) spawn(p, false);
          ctx.save();
          ctx.globalAlpha = p.alpha;
          ctx.translate(p.x + Math.sin(t * p.freq + p.phase) * p.amp, p.y);
          ctx.rotate(p.rot);
          ctx.scale(0.2 + 0.8 * Math.abs(Math.cos(t * p.flip + p.phase)), 1);
          ctx.drawImage(p.sprite, -p.size / 2, -p.size / 2, p.size, p.size);
          ctx.restore();
        }
      },
    };
  }

  function createFireworks(canvas) {
    const ctx = canvas.getContext('2d');
    const DRAG = 2.4;
    const palettes = [
      ['#ff8fab', '#ffc2d1', '#fff0f3'],
      ['#f4cf86', '#ffe7b0', '#fffaf0'],
      ['#ff5d8f', '#ff9fb8', '#ffd6e0'],
      ['#e9a0ff', '#ffc2e2', '#fff0f8'],
    ];
    const parts = [];
    const rockets = [];
    fit(canvas);

    const add = (x, y, vx, vy, color, life = rand(1.4, 2.2), r = rand(1.1, 2.3)) => {
      parts.push({ x, y, vx, vy, color, life, max: life, r });
    };

    function burst(x, y, shape, radius) {
      const pal = pick(palettes);
      const k = radius * DRAG;
      if (shape === 'heart') {
        const n = 110;
        for (let i = 0; i < n; i++) {
          const a = (i / n) * Math.PI * 2;
          const hx = 16 * Math.sin(a) ** 3 / 17;
          const hy = -(13 * Math.cos(a) - 5 * Math.cos(2 * a) - 2 * Math.cos(3 * a) - Math.cos(4 * a)) / 17;
          const j = rand(0.94, 1.06);
          add(x, y, hx * k * j, hy * k * j, pick(pal));
          if (i % 2 === 0) add(x, y, hx * k * 0.55 * j, hy * k * 0.55 * j, pick(pal));
        }
      } else {
        for (let i = 0; i < 90; i++) {
          const a = rand(0, Math.PI * 2);
          const s = k * Math.sqrt(rand(0.15, 1));
          add(x, y, Math.cos(a) * s, Math.sin(a) * s, pick(pal));
        }
      }
    }

    function launch(x, y, shape, radius) {
      rockets.push({ x0: x + rand(-60, 60), y0: innerHeight + 10, x1: x, y1: y, t: 0, dur: rand(0.9, 1.3), shape, radius });
    }

    function step(dt) {
      if (!parts.length && !rockets.length) {
        ctx.clearRect(0, 0, innerWidth, innerHeight);
        return;
      }
      // Xoá dần khung cũ để tạo vệt sáng
      ctx.globalCompositeOperation = 'destination-out';
      ctx.fillStyle = `rgba(0,0,0,${1 - Math.pow(0.8, dt * 60)})`;
      ctx.fillRect(0, 0, innerWidth, innerHeight);
      ctx.globalCompositeOperation = 'lighter';

      for (let i = rockets.length - 1; i >= 0; i--) {
        const r = rockets[i];
        r.t = Math.min(r.t + dt / r.dur, 1);
        const e = 1 - (1 - r.t) ** 3;
        const x = r.x0 + (r.x1 - r.x0) * e;
        const y = r.y0 + (r.y1 - r.y0) * e;
        ctx.globalAlpha = 1;
        ctx.fillStyle = '#fff3d6';
        ctx.beginPath();
        ctx.arc(x, y, 2, 0, Math.PI * 2);
        ctx.fill();
        if (Math.random() < 0.6) add(x, y, rand(-20, 20), rand(10, 40), '#f4cf86', 0.5, 1);
        if (r.t >= 1) {
          rockets.splice(i, 1);
          burst(x, y, r.shape, r.radius);
        }
      }

      const drag = Math.exp(-DRAG * dt);
      for (let i = parts.length - 1; i >= 0; i--) {
        const p = parts[i];
        p.life -= dt;
        if (p.life <= 0) {
          parts[i] = parts[parts.length - 1];
          parts.pop();
          continue;
        }
        p.vx *= drag;
        p.vy = p.vy * drag + 38 * dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        const k = p.life / p.max;
        ctx.globalAlpha = k < 0.35 ? (k / 0.35) * rand(0.5, 1) : 1;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    return { burst, launch, step, resize: () => fit(canvas) };
  }

  function buildBloom() {
    const g = $('.bloom-inner');
    const core = $('#bloomCore');
    let i = 0;
    const add = (rotate, scale, fill) => {
      const wrap = document.createElementNS(NS, 'g');
      wrap.setAttribute('transform', `rotate(${rotate} 60 60)` + (scale === 1 ? '' : ` translate(60 60) scale(${scale}) translate(-60 -60)`));
      const use = document.createElementNS(NS, 'use');
      use.setAttribute('href', '#petal');
      use.setAttribute('fill', fill);
      use.setAttribute('class', 'pt');
      use.style.setProperty('--d', i++);
      wrap.appendChild(use);
      g.insertBefore(wrap, core);
    };
    for (let k = 0; k < 8; k++) add(k * 45, 1, 'url(#petalOuter)');
    for (let k = 0; k < 8; k++) add(22.5 + k * 45, 0.66, 'url(#petalInner)');
  }
})();
</script>
